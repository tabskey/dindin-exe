services:
  api:
    build:
      context: ./src/backend/Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/data/dindin.db"

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "80:80"
    depends_on:
      - api
