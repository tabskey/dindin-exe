sonar.projectKey=dindin-exe-frontend
sonar.projectName=DinDin.exe Frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# src/index.css usa at-rules do Tailwind v4 (@custom-variant, @theme) que o parser
# CSS do SonarQube não reconhece (falso positivo S4662) — excluído da análise.
sonar.exclusions=src/main.tsx,src/assets/**,src/index.css
sonar.sourceEncoding=UTF-8
