# Infraestrutura do SonarQube (Community) para análise de qualidade e cobertura
# do frontend (ADR 0005) — em arquivo separado para não pesar o fluxo de dev
# (`docker compose up` principal continua só com api + frontend).
#
# Uso:
#   docker compose -f docker-compose.sonarqube.yml up -d sonarqube
#   (interface em http://localhost:9000; senha admin inicial: admin)
services:
  sonarqube:
    image: sonarqube:lts-community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions

volumes:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
